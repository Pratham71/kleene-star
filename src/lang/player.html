<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Kleene Star">
<title>{{TITLE}}</title>
<style>
  /* The colours come from Kleene Star's themes (src/theme.rs). */
{{THEME_CSS}}  /* Motion: colour changes only, 150ms, and none with reduced motion. */
  :root { --duration-quick: 150ms; --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1); }
  body, .stage, .box, .cell, button, select, .node circle, .node rect, .edge path, .edge text, .arrow, .arrow-taken {
    transition-property: fill, stroke, color, background-color, border-color, box-shadow;
    transition-duration: var(--duration-quick);
    transition-timing-function: var(--ease-smooth-out);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 20px 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h1 code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .sub { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; padding: 8px 20px 20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .stage { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: auto; min-height: 260px; }
  svg { display: block; margin: 0 auto; }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .box h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .cells { display: flex; flex-wrap: wrap; gap: 3px; }
  .cell { min-width: 24px; height: 28px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center;
          border: 1px solid var(--border); border-radius: 4px; font-family: ui-monospace, Consolas, monospace; background: var(--cell); color: var(--fg); }
  .cell.done { color: var(--muted); opacity: .55; }
  .cell.next, .cell.head { border-color: var(--active); box-shadow: 0 0 0 2px var(--active) inset; }
  .stack { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .empty { color: var(--muted); font-style: italic; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 20px 4px; }
  button, select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
                   padding: 4px 10px; cursor: pointer; min-width: 38px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  #theme { white-space: nowrap; font-size: 13px; }
  .step { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 110px; }
  .verdict { font-weight: 600; }
  .verdict.ACCEPTED { color: var(--accept); }
  .verdict.REJECTED { color: var(--reject); }
  .node circle, .node rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.6; }
  .node.accepting circle { stroke: var(--accept); }
  .node.rejecting rect { stroke: var(--reject); }
  .node.active circle, .node.active rect { fill: var(--active-fill); stroke: var(--active); stroke-width: 2.6; }
  .node text { fill: var(--fg); font: 13px ui-monospace, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
  .edge path { fill: none; stroke: var(--line); stroke-width: 1.4; }
  .edge text { fill: var(--muted); font: 12px ui-monospace, Consolas, monospace; text-anchor: middle; }
  .edge.taken path { stroke: var(--taken); stroke-width: 2.6; }
  .edge.taken text { fill: var(--taken); font-weight: 600; }
  .arrow { fill: var(--line); }
  .arrow-taken { fill: var(--taken); }
  footer { color: var(--muted); font-size: 12px; padding: 0 20px 16px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>
  <button id="theme" type="button" title="Change the colours: auto (as the system), light, dark or high contrast">Theme: auto</button>
</header>
<div class="controls" role="toolbar" aria-label="Playback">
  <button id="first" title="First step (Home)" aria-label="First step">&#x23EE;</button>
  <button id="back" title="Step back (Left arrow)" aria-label="Step back">&#x25C0;</button>
  <button id="play" title="Play or pause (Space)" aria-label="Play">&#x25B6;</button>
  <button id="next" title="Step forward (Right arrow)" aria-label="Step forward">&#x25B6;&#x7C;</button>
  <button id="last" title="Last step (End)" aria-label="Last step">&#x23ED;</button>
  <input id="slider" type="range" min="0" value="0" aria-label="Step">
  <span class="step" id="step" aria-live="polite"></span>
  <label class="sub" for="speed">Speed</label>
  <select id="speed">
    <option value="1600">0.5x</option>
    <option value="800" selected>1x</option>
    <option value="400">2x</option>
    <option value="200">4x</option>
  </select>
</div>
<main>
  <div class="stage"><svg id="graph" role="img" aria-label="State diagram"></svg></div>
  <div class="side">
    <div class="box"><h2>Move</h2><div id="move" class="mono"></div></div>
    <div class="box" id="input-box"><h2>Input</h2><div id="input" class="cells"></div></div>
    <div class="box" id="stack-box" hidden><h2>Stack (top first)</h2><div id="stack" class="stack"></div></div>
    <div class="box" id="tape-box" hidden><h2>Tape</h2><div id="tape" class="cells"></div></div>
    <div class="box"><h2>Result</h2><div id="result"></div></div>
  </div>
</main>
<footer>Made by Kleene Star with <code>draw M on "w"</code>. Space plays and pauses; the arrow keys step; T changes the theme.</footer>
<script type="application/json" id="kstar-run">{{DATA}}</script>
<script>
"use strict";
(function () {
  const run = JSON.parse(document.getElementById("kstar-run").textContent);
  const SVG = "http://www.w3.org/2000/svg";
  const R = 24;
  const $ = (id) => document.getElementById(id);
  const el = (name, attrs, parent) => {
    const e = document.createElementNS(SVG, name);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  };
  const div = (cls, text, parent) => {
    const d = document.createElement("div");
    d.className = cls;
    d.textContent = text;
    parent.appendChild(d);
    return d;
  };

  $("title").textContent = run.title + " on “" + run.word + "”";
  $("sub").textContent = run.kind + " with " + run.states.length + " state" + (run.states.length === 1 ? "" : "s") +
    ", " + (run.frames.length - 1) + " step" + (run.frames.length === 2 ? "" : "s");

  // ---- the theme ----
  // Starts as the page was written (auto follows the system); the button
  // goes through the four, and the choice is kept for the next page.
  const THEMES = ["auto", "light", "dark", "high-contrast"];
  const NAMES = { "auto": "auto", "light": "light", "dark": "dark", "high-contrast": "high contrast" };
  const root = document.documentElement;
  function setTheme(name) {
    root.setAttribute("data-theme", name);
    $("theme").textContent = "Theme: " + NAMES[name];
    $("theme").setAttribute("aria-label", "Theme: " + NAMES[name] + ". Change the colours");
  }
  let saved = null;
  try { saved = localStorage.getItem("kstar-theme"); } catch (e) { /* storage may be off for files */ }
  setTheme(THEMES.includes(saved) ? saved : (THEMES.includes(root.getAttribute("data-theme")) ? root.getAttribute("data-theme") : "auto"));
  $("theme").addEventListener("click", () => {
    const next = THEMES[(THEMES.indexOf(root.getAttribute("data-theme")) + 1) % THEMES.length];
    setTheme(next);
    try { localStorage.setItem("kstar-theme", next); } catch (e) { /* not kept */ }
  });

  // ---- the diagram ----
  const svg = $("graph");
  const maxX = Math.max(...run.states.map((s) => s.x)) + 110;
  const maxY = Math.max(...run.states.map((s) => s.y)) + 70;
  svg.setAttribute("viewBox", "0 0 " + maxX + " " + maxY);
  // As wide as the stage allows, up to one and a half times life size.
  svg.style.width = "100%";
  svg.style.maxWidth = Math.round(maxX * 1.5) + "px";
  const defs = el("defs", {}, svg);
  for (const [id, cls] of [["arrow", "arrow"], ["arrow-taken", "arrow-taken"]]) {
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", class: cls }, m);
  }
  const pairs = new Set(run.edges.map((e) => e.from + ">" + e.to));
  const edgeGroups = run.edges.map((e) => {
    const a = run.states[e.from], b = run.states[e.to];
    const g = el("g", { class: "edge" }, svg);
    const path = el("path", { "marker-end": "url(#arrow)" }, g);
    let lx, ly;
    if (e.from === e.to) {
      path.setAttribute("d", "M" + (a.x - 10) + "," + (a.y - R + 2) + " C" + (a.x - 34) + "," + (a.y - 78) + " " + (a.x + 34) + "," + (a.y - 78) + " " + (a.x + 10) + "," + (a.y - R + 2));
      lx = a.x; ly = a.y - 66;
    } else {
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      // Bend the edge when the opposite edge exists, or when it would run
      // through a state in between, so that edges and labels stay apart.
      // An edge across several columns bows out further, past the states
      // between its ends.
      const span = Math.round(Math.abs(dx) / 170);
      const bend = (pairs.has(e.to + ">" + e.from) ? 28 : 0) + (span > 1 ? 34 * span : 0);
      const sx = a.x + ux * R, sy = a.y + uy * R, tx = b.x - ux * R, ty = b.y - uy * R;
      const cx = (sx + tx) / 2 - uy * bend * 2, cy = (sy + ty) / 2 + ux * bend * 2;
      path.setAttribute("d", "M" + sx + "," + sy + " Q" + cx + "," + cy + " " + tx + "," + ty);
      lx = (sx + 2 * cx + tx) / 4; ly = (sy + 2 * cy + ty) / 4 - 6;
    }
    e.labels.forEach((label, i) => {
      const t = el("text", { x: lx, y: ly - (e.labels.length - 1 - i) * 14 }, g);
      t.textContent = label;
    });
    return { e, g, path };
  });
  const start = run.states.find((s) => s.start);
  if (start) el("path", { d: "M" + (start.x - R - 34) + "," + start.y + " L" + (start.x - R - 2) + "," + start.y, class: "edge", stroke: "currentColor", "marker-end": "url(#arrow)", style: "stroke: var(--line); stroke-width: 1.4" }, svg);
  const nodes = run.states.map((s) => {
    const g = el("g", { class: "node" + (s.accept ? " accepting" : "") + (s.reject ? " rejecting" : "") }, svg);
    if (s.reject) {
      el("rect", { x: s.x - R, y: s.y - R, width: 2 * R, height: 2 * R, rx: 4 }, g);
    } else {
      el("circle", { cx: s.x, cy: s.y, r: R }, g);
      if (s.accept) el("circle", { cx: s.x, cy: s.y, r: R - 5 }, g);
    }
    const t = el("text", { x: s.x, y: s.y }, g);
    t.textContent = s.name.length > 9 ? s.name.slice(0, 8) + "…" : s.name;
    const tip = el("title", {}, g);
    tip.textContent = s.name + (s.start ? " (start)" : "") + (s.accept ? " (accepting)" : "") + (s.reject ? " (rejecting)" : "");
    return g;
  });

  // ---- one step ----
  const word = Array.from(run.word);
  let at = 0;
  function show(i) {
    at = Math.max(0, Math.min(run.frames.length - 1, i));
    const f = run.frames[at];
    nodes.forEach((g, s) => g.classList.toggle("active", f.active.includes(s)));
    const taken = new Set(f.taken.map(([a, b]) => a + ">" + b));
    for (const { e, g, path } of edgeGroups) {
      const on = taken.has(e.from + ">" + e.to);
      g.classList.toggle("taken", on);
      path.setAttribute("marker-end", on ? "url(#arrow-taken)" : "url(#arrow)");
    }
    $("slider").value = at;
    $("step").textContent = "Step " + at + " of " + (run.frames.length - 1);
    const names = f.active.map((s) => run.states[s].name).join(", ");
    $("move").textContent = at === 0 ? "Start in " + (names || "no state") : f.label + "  →  " + (names || "no state");
    const input = $("input");
    input.textContent = "";
    if (f.read === null) {
      $("input-box").hidden = true;
    } else if (word.length === 0) {
      div("empty", "the empty word", input);
    } else {
      word.forEach((c, k) => div("cell" + (k < f.read ? " done" : k === f.read ? " next" : ""), c, input));
    }
    if (f.stack !== null) {
      $("stack-box").hidden = false;
      const st = $("stack");
      st.textContent = "";
      if (f.stack.length === 0) div("empty", "empty", st);
      f.stack.forEach((sym) => div("cell", sym, st));
    }
    if (f.tape !== null) {
      $("tape-box").hidden = false;
      const tp = $("tape");
      tp.textContent = "";
      Array.from(f.tape.cells).forEach((c, k) => div("cell" + (k === f.tape.head ? " head" : ""), c, tp));
    }
    const result = $("result");
    result.textContent = "";
    if (at === run.frames.length - 1) {
      div("verdict " + run.result, run.result, result);
      div("sub", run.reason, result);
    } else {
      div("empty", "running…", result);
    }
  }

  // ---- playing ----
  let timer = null;
  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    $("play").innerHTML = "&#x25B6;";
    $("play").setAttribute("aria-label", "Play");
  }
  function playPause() {
    if (timer) return stop();
    if (at >= run.frames.length - 1) show(0);
    $("play").innerHTML = "&#x23F8;";
    $("play").setAttribute("aria-label", "Pause");
    timer = setInterval(() => {
      if (at >= run.frames.length - 1) return stop();
      show(at + 1);
    }, Number($("speed").value));
  }
  $("slider").max = run.frames.length - 1;
  $("slider").addEventListener("input", (e) => { stop(); show(Number(e.target.value)); });
  $("first").addEventListener("click", () => { stop(); show(0); });
  $("back").addEventListener("click", () => { stop(); show(at - 1); });
  $("next").addEventListener("click", () => { stop(); show(at + 1); });
  $("last").addEventListener("click", () => { stop(); show(run.frames.length - 1); });
  $("play").addEventListener("click", playPause);
  $("speed").addEventListener("change", () => { if (timer) { stop(); playPause(); } });
  document.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
    if (e.key === " ") { e.preventDefault(); playPause(); }
    else if (e.key === "ArrowRight") { stop(); show(at + 1); }
    else if (e.key === "ArrowLeft") { stop(); show(at - 1); }
    else if (e.key === "Home") { stop(); show(0); }
    else if (e.key === "End") { stop(); show(run.frames.length - 1); }
    else if (e.key === "t" || e.key === "T") { $("theme").click(); }
  });
  show(0);
})();
</script>
</body>
</html>
