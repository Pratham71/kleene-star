[package]
name = "toc"
version = "0.1.0"
edition = "2021"
description = "TOC-Lang: a small language for Theory of Computation"

[lib]
name = "toc"
path = "src/lib.rs"

[[bin]]
name = "toc"
path = "src/main.rs"

# The language server for editors; see editors/vscode.
[[bin]]
name = "toc-lsp"
path = "src/bin/toc-lsp.rs"

[dependencies]
rustyline = "19.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp-server = "0.23"
