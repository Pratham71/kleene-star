[package]
name = "kstar"
version = "0.1.0"
edition = "2021"
# `cargo run` runs the language, not the language server.
default-run = "kstar"
description = "Kleene Star: a small language for Theory of Computation"

[lib]
name = "kstar"
path = "src/lib.rs"

[[bin]]
name = "kstar"
path = "src/main.rs"

# The language server for editors; see editors/vscode.
[[bin]]
name = "kstar-lsp"
path = "src/bin/kstar-lsp.rs"

[dependencies]
rustyline = "19.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp-server = "0.23"
