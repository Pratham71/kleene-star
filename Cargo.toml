[package]
name = "kstar"
version = "0.8.1"
edition = "2021"
# `cargo run` runs the language, not the language server.
default-run = "kstar"
description = "Kleene Star: a small language for Theory of Computation"
license = "MIT"
repository = "https://github.com/Pratham71/kleene-star"
readme = "README.md"

[lib]
name = "kstar"
path = "src/lib.rs"

[[bin]]
name = "kstar"
path = "src/main.rs"

# The language server for editors; see editors/vscode.
[[bin]]
name = "kstar-lsp"
path = "src/bin/kstar-lsp.rs"

[dependencies]
rustyline = "19.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp-server = "0.23"
# Reads JSON machines (`from_json`). Already built for the language server,
# so it adds nothing new to the build.
serde_json = "1"
# The terminal UI (`kstar update`, `kstar tui`): ratatui draws it and its
# crossterm backend talks to the terminal, the same way on Windows
# Terminal, PowerShell and Unix terminals. Only the crossterm backend and
# the basic widgets are built.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
# `kstar update` downloads the release itself, over HTTPS with rustls (and
# its ring backend, which needs no CMake), and unpacks its .zip or .tar.gz:
# no PowerShell, shell, curl or gh is started to update.
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }

# Puts the icon into kstar.exe; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
