# Weekly pull requests for outdated dependencies, grouped so each
# ecosystem gets one pull request at a time.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
