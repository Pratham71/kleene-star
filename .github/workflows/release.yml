# Builds and publishes a release when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Every platform runs the tests before its build is packaged. The release
# gets, for each platform, an archive with kstar and kstar-lsp plus its
# SHA-256 checksum, the Windows installer (tested by installing and
# uninstalling it), the VS Code extension and a SHA256SUMS file.
#
# On Windows, kstar.exe, kstar-lsp.exe and kstar-setup-x64.exe are signed
# through SignPath (see CODE_SIGNING_POLICY.md and docs/signing/SETUP.md)
# when the repository has a SIGNPATH_API_TOKEN secret; each signing request
# waits for a person to approve it. Without the secret, signing is skipped
# and the release is unsigned, as before.
#
# The tag must match the version in Cargo.toml, and CHANGELOG.md must have
# a section for that version, which becomes the release notes (see
# .github/scripts/release-notes.sh and "Making a release" in
# CONTRIBUTING.md). A plain version tag
# (v1.2.3) publishes a release; a tag with a suffix (v0.2.4-beta) publishes a
# pre-release, which GitHub does not count as the latest. Running the
# workflow by hand does everything else and leaves the files as the run's
# artifacts, as a dry run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - os: ubuntu-22.04 # an older glibc, so the binary runs on more Linux systems
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          # Apple Silicon is cross-compiled on the Intel runner: GitHub's
          # arm64 macOS runners have at times been too short of capacity to
          # pick up jobs at all. The tests run natively in test-arm64 below.
          - os: macos-15-intel
            target: aarch64-apple-darwin
            cross: cross
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: cargo test
        run: cargo test --all-targets --no-fail-fast
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        # The Windows programs are packaged by windows-programs, after signing.
        if: matrix.exe != '.exe'
        shell: bash
        run: .github/scripts/package.sh "${{ matrix.target }}" "${{ matrix.exe }}" "${{ matrix.cross }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.exe != '.exe'
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.exe == '.exe'
        with:
          name: programs-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/kstar.exe
            target/${{ matrix.target }}/release/kstar-lsp.exe
          if-no-files-found: error

  # Signs kstar.exe and kstar-lsp.exe (when SIGNPATH_API_TOKEN is set), checks
  # their version details, and packages them as the other platforms are.
  windows-programs:
    name: Windows programs (signed when set up)
    needs: build
    runs-on: windows-latest
    # A signing request waits for a person to approve it; GitHub stops a job
    # after six hours.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read # the signing action downloads the artifact it signs
    env:
      TARGET: x86_64-pc-windows-msvc
      # Only whether the secret exists: `if:` cannot read secrets.
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: programs-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release
      - name: version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: signing is off
        if: env.SIGNING != 'yes'
        run: echo "Code signing is off (no SIGNPATH_API_TOKEN secret); the Windows programs are released unsigned."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: unsigned
        if: env.SIGNING == 'yes'
        with:
          name: unsigned-programs
          path: |
            target/x86_64-pc-windows-msvc/release/kstar.exe
            target/x86_64-pc-windows-msvc/release/kstar-lsp.exe
          if-no-files-found: error
      - name: sign kstar.exe and kstar-lsp.exe
        if: env.SIGNING == 'yes'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 20700
          output-artifact-directory: signed
      - name: use the signed programs
        if: env.SIGNING == 'yes'
        shell: pwsh
        run: |
          foreach ($exe in "kstar.exe", "kstar-lsp.exe") {
            $signed = Get-ChildItem signed -Recurse -Filter $exe | Select-Object -First 1
            if (-not $signed) { throw "the signed artifact has no $exe" }
            $status = (Get-AuthenticodeSignature $signed.FullName).Status
            if ($status -ne "Valid") { throw "$exe is not validly signed: $status" }
            Copy-Item $signed.FullName "target\$env:TARGET\release\$exe" -Force
          }
      - name: check the version details
        shell: pwsh
        run: installer\check-version-info.ps1 -Version "${{ steps.version.outputs.version }}" -Files "target\$env:TARGET\release\kstar.exe", "target\$env:TARGET\release\kstar-lsp.exe"
      - name: package
        shell: bash
        run: .github/scripts/package.sh "$TARGET" .exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: [windows-programs, vscode]
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read # the signing action downloads the artifact it signs
    env:
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-x86_64-pc-windows-msvc
          path: files
      # The installer carries the extension and installs it in VS Code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-vsix
          path: vsix
      - name: find or install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup is already on this runner"
          } else {
            Write-Host "Inno Setup is not on this runner; installing it"
            choco install innosetup --yes --no-progress
            if (-not (Test-Path $iscc)) { throw "ISCC.exe is still missing after installing Inno Setup" }
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: build kstar-setup-x64.exe
        shell: pwsh
        run: |
          Expand-Archive files\kstar-x86_64-pc-windows-msvc.zip -DestinationPath programs
          $version = (& programs\kstar.exe version | Select-Object -First 1) -replace '^kstar ', ''
          $vsix = (Get-ChildItem vsix\*.vsix | Select-Object -First 1).FullName
          & $env:ISCC "/DAppVersion=$version" "/DSourceDir=$PWD\programs" "/DVsixFile=$vsix" "/O$PWD\dist" installer\kstar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: signing is off
        if: env.SIGNING != 'yes'
        run: echo "Code signing is off (no SIGNPATH_API_TOKEN secret); kstar-setup-x64.exe is released unsigned."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: unsigned
        if: env.SIGNING == 'yes'
        with:
          name: unsigned-installer
          path: dist/kstar-setup-x64.exe
          if-no-files-found: error
      - name: sign kstar-setup-x64.exe
        if: env.SIGNING == 'yes'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion-timeout-in-seconds: 20700
          output-artifact-directory: signed
      - name: use the signed installer
        if: env.SIGNING == 'yes'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter kstar-setup-x64.exe | Select-Object -First 1
          if (-not $signed) { throw "the signed artifact has no kstar-setup-x64.exe" }
          $status = (Get-AuthenticodeSignature $signed.FullName).Status
          if ($status -ne "Valid") { throw "kstar-setup-x64.exe is not validly signed: $status" }
          Copy-Item $signed.FullName dist\kstar-setup-x64.exe -Force
      - name: check the version details
        shell: pwsh
        run: installer\check-version-info.ps1 -Version $env:VERSION -Files dist\kstar-setup-x64.exe
      # So the test can check that the installer adds the extension to VS
      # Code and that the uninstaller removes it.
      - name: install VS Code
        shell: pwsh
        run: choco install vscode --yes --no-progress
      - name: install, check and uninstall
        shell: pwsh
        run: installer\test-installer.ps1 -Setup dist\kstar-setup-x64.exe -ExpectVSCode
      # After signing: the checksum is of the file that is published.
      - name: checksum
        shell: bash
        run: cd dist && sha256sum kstar-setup-x64.exe > kstar-setup-x64.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-installer
          path: dist/*
          if-no-files-found: error

  install-scripts:
    name: install script (${{ matrix.os }})
    needs: [build, windows-programs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.target }}
          path: files
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KSTAR_INSTALL_FROM = "$PWD\files"
          # The way the README runs it: the script's text piped into iex.
          Get-Content install.ps1 -Raw | Invoke-Expression
          $bin = Join-Path $env:LOCALAPPDATA "Programs\Kleene Star\bin"
          & "$bin\kstar.exe" version
          if ($LASTEXITCODE -ne 0) { throw "kstar version failed" }
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not (($path -split ";") -contains $bin)) { throw "$bin is not on the user's PATH: $path" }
          # A wrong checksum must stop the install.
          Copy-Item -Recurse files bad
          Set-Content bad\kstar-x86_64-pc-windows-msvc.zip.sha256 ("0" * 64)
          $env:KSTAR_INSTALL_FROM = "$PWD\bad"
          $failed = $false
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $failed = $true; Write-Host "Refused as expected: $_" }
          if (-not $failed) { throw "install.ps1 accepted a wrong checksum" }
          # With VS Code present (a stand-in that logs its arguments), the
          # extension of the same release is installed too.
          $version = ((& "$bin\kstar.exe" version | Select-Object -First 1) -split " ")[1]
          Set-Content "files\kleene-star-$version.vsix" "a stand-in"
          $sum = (Get-FileHash "files\kleene-star-$version.vsix" -Algorithm SHA256).Hash.ToLower()
          Set-Content "files\kleene-star-$version.vsix.sha256" "$sum  kleene-star-$version.vsix"
          Set-Content code.cmd "@echo %* >> `"$PWD\code-log.txt`""
          $env:KSTAR_CODE = "$PWD\code.cmd"
          $env:KSTAR_INSTALL_FROM = "$PWD\files"
          Get-Content install.ps1 -Raw | Invoke-Expression
          $log = Get-Content code-log.txt -Raw
          if ($log -notmatch "--install-extension .*kleene-star-$version\.vsix --force") { throw "the extension was not installed: $log" }
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v shellcheck >/dev/null; then shellcheck install.sh; fi
          KSTAR_INSTALL_FROM="$PWD/files" sh install.sh
          "$HOME/.kstar/bin/kstar" version
          grep -F '.kstar/bin' "$HOME/.profile"
          # `man kstar` works through the PATH entry, with no MANPATH.
          PATH="$HOME/.kstar/bin:$PATH" man -w kstar | grep -F "$HOME/.kstar/share/man/man1/kstar.1"
          PATH="$HOME/.kstar/bin:$PATH" man -w kstar-export
          test -f "$HOME/.kstar/share/info/kstar.info"
          # Running it again must not add the PATH line twice.
          KSTAR_INSTALL_FROM="$PWD/files" sh install.sh
          test "$(grep -cF '.kstar/bin' "$HOME/.profile")" = 1
          # A wrong checksum must stop the install.
          cp -R files bad
          printf '%064d  x\n' 0 > bad/kstar-${{ matrix.target }}.tar.gz.sha256
          if KSTAR_INSTALL_FROM="$PWD/bad" sh install.sh; then echo "install.sh accepted a wrong checksum"; exit 1; fi
          # With VS Code present (a stand-in that logs its arguments), the
          # extension of the same release is installed too.
          version=$("$HOME/.kstar/bin/kstar" version | head -n 1 | cut -d ' ' -f 2)
          echo "a stand-in" > "files/kleene-star-$version.vsix"
          (cd files && { sha256sum "kleene-star-$version.vsix" 2>/dev/null || shasum -a 256 "kleene-star-$version.vsix"; } > "kleene-star-$version.vsix.sha256")
          printf '#!/bin/sh\necho "$@" >> "%s/code-log.txt"\n' "$PWD" > fake-code && chmod +x fake-code
          KSTAR_CODE="$PWD/fake-code" KSTAR_INSTALL_FROM="$PWD/files" sh install.sh
          grep -E -- "--install-extension .*kleene-star-$version\.vsix --force" code-log.txt
          # --uninstall removes the programs, the pages and the PATH line.
          sh install.sh --uninstall
          test ! -e "$HOME/.kstar"
          if grep -F '.kstar/bin' "$HOME/.profile"; then echo "the PATH line is still there"; exit 1; fi

  vscode:
    name: VS Code extension
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The extension's tests use the debug kstar and kstar-lsp.
      - run: cargo build
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - name: package the .vsix
        working-directory: editors/vscode
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p ../../dist
          cp ../../LICENSE LICENSE && npx vsce package -o "../../dist/kleene-star-$version.vsix"
          cd ../../dist && sha256sum "kleene-star-$version.vsix" > "kleene-star-$version.vsix.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-vsix
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: [build, windows-programs, installer, install-scripts, vscode]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          cat *.sha256 | sed 's/ \*/  /' | sort -k 2 > SHA256SUMS
          cat SHA256SUMS
      - name: decide whether to publish
        id: publish
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
            if [ "v$version" != "$tag" ]; then
              echo "::error::the tag $tag does not match the version in Cargo.toml ($version)"
              exit 1
            fi
            # Stops here if CHANGELOG.md has no section for this version.
            .github/scripts/release-notes.sh "$tag" > /dev/null
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            # A suffix (v0.2.4-beta) makes it a pre-release.
            if [[ "$tag" == *-* ]]; then
              echo "prerelease=--prerelease --latest=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Not a version tag ($GITHUB_REF): a dry run, nothing is published."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.publish.outputs.tag == ''
        with:
          name: dry-run-release
          path: dist/*
      - name: publish the release
        if: steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
          PRERELEASE: ${{ steps.publish.outputs.prerelease }}
        # The notes are the version's section of CHANGELOG.md, followed by
        # how to install it and how to check the download.
        run: |
          .github/scripts/release-notes.sh "$TAG" > notes.md
          cat notes.md
          gh release create "$TAG" dist/* --title "Kleene Star ${TAG#v}" --notes-file notes.md --verify-tag $PRERELEASE

  # The tests on a real Apple Silicon machine. The release does not wait for
  # this job, since arm64 runners are sometimes unavailable; if it fails,
  # fix it in the next release.
  test-arm64:
    name: test (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        run: cargo test --all-targets --no-fail-fast
