# Builds and publishes a release when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Every platform runs the tests before its build is packaged. The release
# gets, for each platform, an archive with kstar and kstar-lsp plus its
# SHA-256 checksum, the Windows installer (tested by installing and
# uninstalling it), the VS Code extension and a SHA256SUMS file.
#
# Only plain version tags (v1.2.3) publish a release. A tag with a suffix,
# such as v0.2.0-rc.1, or running the workflow by hand, does everything
# else and leaves the files as the run's artifacts, as a dry run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - os: ubuntu-22.04 # an older glibc, so the binary runs on more Linux systems
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          # Apple Silicon is cross-compiled on the Intel runner: GitHub's
          # arm64 macOS runners have at times been too short of capacity to
          # pick up jobs at all. The tests run natively in test-arm64 below.
          - os: macos-15-intel
            target: aarch64-apple-darwin
            cross: cross
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: cargo test
        run: cargo test --all-targets --no-fail-fast
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: .github/scripts/package.sh "${{ matrix.target }}" "${{ matrix.exe }}" "${{ matrix.cross }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: [build, vscode]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-x86_64-pc-windows-msvc
          path: files
      # The installer carries the extension and installs it in VS Code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-vsix
          path: vsix
      - name: find or install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup is already on this runner"
          } else {
            Write-Host "Inno Setup is not on this runner; installing it"
            choco install innosetup --yes --no-progress
            if (-not (Test-Path $iscc)) { throw "ISCC.exe is still missing after installing Inno Setup" }
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: build kstar-setup-x64.exe
        shell: pwsh
        run: |
          Expand-Archive files\kstar-x86_64-pc-windows-msvc.zip -DestinationPath programs
          $version = (& programs\kstar.exe version | Select-Object -First 1) -replace '^kstar ', ''
          $vsix = (Get-ChildItem vsix\*.vsix | Select-Object -First 1).FullName
          & $env:ISCC "/DAppVersion=$version" "/DSourceDir=$PWD\programs" "/DVsixFile=$vsix" "/O$PWD\dist" installer\kstar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      # So the test can check that the installer adds the extension to VS
      # Code and that the uninstaller removes it.
      - name: install VS Code
        shell: pwsh
        run: choco install vscode --yes --no-progress
      - name: install, check and uninstall
        shell: pwsh
        run: installer\test-installer.ps1 -Setup dist\kstar-setup-x64.exe -ExpectVSCode
      - name: checksum
        shell: bash
        run: cd dist && sha256sum kstar-setup-x64.exe > kstar-setup-x64.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-installer
          path: dist/*
          if-no-files-found: error

  install-scripts:
    name: install script (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.target }}
          path: files
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KSTAR_INSTALL_FROM = "$PWD\files"
          # The way the README runs it: the script's text piped into iex.
          Get-Content install.ps1 -Raw | Invoke-Expression
          $bin = Join-Path $env:LOCALAPPDATA "Programs\Kleene Star\bin"
          & "$bin\kstar.exe" version
          if ($LASTEXITCODE -ne 0) { throw "kstar version failed" }
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not (($path -split ";") -contains $bin)) { throw "$bin is not on the user's PATH: $path" }
          # A wrong checksum must stop the install.
          Copy-Item -Recurse files bad
          Set-Content bad\kstar-x86_64-pc-windows-msvc.zip.sha256 ("0" * 64)
          $env:KSTAR_INSTALL_FROM = "$PWD\bad"
          $failed = $false
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $failed = $true; Write-Host "Refused as expected: $_" }
          if (-not $failed) { throw "install.ps1 accepted a wrong checksum" }
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v shellcheck >/dev/null; then shellcheck install.sh; fi
          KSTAR_INSTALL_FROM="$PWD/files" sh install.sh
          "$HOME/.kstar/bin/kstar" version
          grep -F '.kstar/bin' "$HOME/.profile"
          # Running it again must not add the PATH line twice.
          KSTAR_INSTALL_FROM="$PWD/files" sh install.sh
          test "$(grep -cF '.kstar/bin' "$HOME/.profile")" = 1
          # A wrong checksum must stop the install.
          cp -R files bad
          printf '%064d  x\n' 0 > bad/kstar-${{ matrix.target }}.tar.gz.sha256
          if KSTAR_INSTALL_FROM="$PWD/bad" sh install.sh; then echo "install.sh accepted a wrong checksum"; exit 1; fi

  vscode:
    name: VS Code extension
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The extension's tests use the debug kstar and kstar-lsp.
      - run: cargo build
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - name: package the .vsix
        working-directory: editors/vscode
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p ../../dist
          cp ../../LICENSE LICENSE && npx vsce package -o "../../dist/kleene-star-$version.vsix"
          cd ../../dist && sha256sum "kleene-star-$version.vsix" > "kleene-star-$version.vsix.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-vsix
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: [build, installer, install-scripts, vscode]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          cat *.sha256 | sed 's/ \*/  /' | sort -k 2 > SHA256SUMS
          cat SHA256SUMS
      - name: decide whether to publish
        id: publish
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if [[ "$GITHUB_REF" == refs/tags/v* && "$tag" != *-* ]]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
            if [ "v$version" != "$tag" ]; then
              echo "::error::the tag $tag does not match the version in Cargo.toml ($version)"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "Not a plain version tag ($GITHUB_REF): a dry run, nothing is published."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.publish.outputs.tag == ''
        with:
          name: dry-run-release
          path: dist/*
      - name: publish the release
        if: steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          cat > notes.md <<EOF
          ## Installing

          - **Windows:** download and run \`kstar-setup-x64.exe\`, or use \`install.ps1\` (see the README).
          - **Linux and macOS:** use \`install.sh\` (see the README), or unpack the archive for your system and put \`kstar\` and \`kstar-lsp\` on your PATH.
          - **VS Code:** \`code --install-extension kleene-star-${TAG#v}.vsix\`

          Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`.
          EOF
          gh release create "$TAG" dist/* --title "Kleene Star ${TAG#v}" --notes-file notes.md --generate-notes --verify-tag

  # The tests on a real Apple Silicon machine. The release does not wait for
  # this job, since arm64 runners are sometimes unavailable; if it fails,
  # fix it in the next release.
  test-arm64:
    name: test (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        run: cargo test --all-targets --no-fail-fast
