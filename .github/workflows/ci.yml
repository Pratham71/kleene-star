# Runs the tests and clippy on Windows, Linux and macOS for every push and
# pull request, so platform differences (line endings, paths, console
# encoding) are caught before they reach main, then tests and packages the
# VS Code extension. It can also be run by hand from the Actions tab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel rather than macos-latest: in November 2026 GitHub's
        # arm64 macOS runners were too short of capacity to pick up jobs for
        # this repository. Switch back to macos-latest once they recover.
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        run: cargo test --all-targets --no-fail-fast
      - name: doc tests
        run: cargo test --doc
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: examples are formatted
        shell: bash
        run: cargo run --quiet -- fmt --check examples

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The extension's tests use the debug `kstar` and `kstar-lsp`.
      - name: build kstar and kstar-lsp
        run: cargo build
      - name: npm ci
        working-directory: editors/vscode
        run: npm ci
      - name: npm test
        working-directory: editors/vscode
        run: npm test
      - name: package the .vsix
        working-directory: editors/vscode
        run: cp ../../LICENSE LICENSE && npx vsce package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kleene-star-vsix
          path: editors/vscode/*.vsix
